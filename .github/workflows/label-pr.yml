name: Label PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest

    steps:
      - name: Apply file-based labels
        uses: actions/labeler@v5
        with:
          sync-labels: true

      - name: Apply title-based labels
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.pull_request.title || '').toLowerCase();
            const labelsToAdd = new Set();
            const wordPattern = /(^|\s|[-_/])([a-z]+)(?=\s|[-_/]|$)/g;

            const words = new Set();
            for (const match of title.matchAll(wordPattern)) {
              words.add(match[2]);
            }

            if (words.has('fix') || /(^|\s)(bug)(?=\s|$)/.test(title)) {
              labelsToAdd.add('fix');
              labelsToAdd.add('bug');
            }

            if (/(^|\s)(doc|docs|documentation)(?=\s|$)/.test(title)) {
              labelsToAdd.add('documentation');
            }

            if (/(^|\s)(feat|feature|enhancement)(?=\s|$)/.test(title)) {
              labelsToAdd.add('feature');
              labelsToAdd.add('enhancement');
            }

            for (const label of labelsToAdd) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [label]
              });
            }
