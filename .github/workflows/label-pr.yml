name: Label PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest

    steps:
      - name: Apply file-based labels
        uses: actions/labeler@v7
        with:
          sync-labels: true

      - name: Apply title-based labels
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.pull_request.title || '').toLowerCase();
            const labelsToAdd = new Set();
            const tokens = title.match(/[a-z]+/g) || [];
            const tokenSet = new Set(tokens);

            if (tokenSet.has('fix') || tokenSet.has('bug')) {
              labelsToAdd.add('fix');
              labelsToAdd.add('bug');
            }

            if (['doc', 'docs', 'documentation'].some(token => tokenSet.has(token))) {
              labelsToAdd.add('documentation');
            }

            if (['feat', 'feature', 'enhancement'].some(token => tokenSet.has(token))) {
              labelsToAdd.add('feature');
              labelsToAdd.add('enhancement');
            }

            for (const label of labelsToAdd) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [label]
              });
            }
