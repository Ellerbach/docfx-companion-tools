name: Label PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest

    steps:
      - name: Apply file-based labels
        uses: actions/labeler@v5
        with:
          sync-labels: true

      - name: Apply title-based labels
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.pull_request.title || '').toLowerCase();
            const labelsToAdd = new Set();

            if (title.includes('fix') || title.includes('bug')) {
              labelsToAdd.add('fix');
              labelsToAdd.add('bug');
            }

            if (title.includes('doc') || title.includes('documentation')) {
              labelsToAdd.add('documentation');
            }

            if (title.includes('feat') || title.includes('feature') || title.includes('enhancement')) {
              labelsToAdd.add('feature');
              labelsToAdd.add('enhancement');
            }

            for (const label of labelsToAdd) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [label]
              });
            }
